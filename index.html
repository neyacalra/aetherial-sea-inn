<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星海旅店｜買房基金進度</title>
<style>
body {
  font-family: "Noto Sans TC", system-ui, sans-serif;
  max-width: 750px;
  margin: 40px auto;
  line-height: 1.6;
  background: linear-gradient(to bottom, #0b0f2a, #1b1f3f);
  color: #f0f0f0;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

h2, h3 {
  color: #ffd700;
  text-shadow: 0 0 6px #00bfff;
}

progress {
  width: 100%;
  height: 28px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  background-color: #2a2f4a;
}

progress::-webkit-progress-bar { background-color: #2a2f4a; }
progress::-webkit-progress-value { background: linear-gradient(90deg, #00bfff, #8a2be2); }
progress::-moz-progress-bar { background: linear-gradient(90deg, #00bfff, #8a2be2); }

#text { font-weight: bold; margin-bottom: 20px; color: #00ffff; }

input, button {
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}

input { width: calc(50% - 10px); margin-right: 10px; }

button {
  background: linear-gradient(to right, #00bfff, #8a2be2);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: linear-gradient(to right, #8a2be2, #00bfff); }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

th {
  background: rgba(0,191,255,0.3);
  color: #fff;
  text-shadow: 0 0 3px #000;
}

tbody tr:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<h2>🚢 星海旅店｜買房基金進度</h2>

<progress id="bar" value="0" max="50000000"></progress>
<p id="text">0 / 50,000,000</p>

<h3>新增紀錄</h3>
<input type="text" id="name" placeholder="角色名稱">
<input type="number" id="amount" placeholder="輸入金額">
<br>
<button onclick="addRecord()">新增</button>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr><th>名稱</th><th>金額</th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/XXXX/exec"; // ← 改成你的 Apps Script URL
const MAX = 50000000;

async function fetchRecords() {
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  return data;
}

async function updateUI() {
  const records = await fetchRecords();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let total = 0;
  records.forEach(r => {
    total += Number(r.amount);
    const row = document.createElement("tr");
    row.innerHTML = `<td>${r.name}</td><td>${Number(r.amount).toLocaleString()}</td>`;
    list.appendChild(row);
  });
  document.getElementById("bar").value = total;
  document.getElementById("text").innerText = total.toLocaleString() + " / " + MAX.toLocaleString();
}

async function addRecord() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);
  if (!name || amount <= 0) { alert("請輸入名稱與正確金額"); return; }

  await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({name, amount})
  });

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
  updateUI();
}

setInterval(updateUI, 5000);
updateUI();
</script>

</body>
</html>
