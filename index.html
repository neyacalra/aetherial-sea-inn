<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星海旅店｜潛水艇基金進度</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    max-width: 600px;
    margin: 40px auto;
    line-height: 1.6;
  }
  progress {
    width: 100%;
    height: 24px;
  }
  input, button {
    padding: 6px;
    margin: 4px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 6px;
    text-align: left;
  }
  th {
    background: #f5f5f5;
  }
</style>
</head>

<body>

<h2>🚢 星海旅店｜潛水艇基金進度</h2>

<progress id="bar" value="0" max="50000000"></progress>
<p id="text">0 / 50,000,000</p>

<h3>新增紀錄</h3>
<input type="text" id="name" placeholder="角色名稱">
<br>
<input type="number" id="amount" placeholder="輸入金額">
<br>
<button onclick="add()">新增</button>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr>
      <th>名稱</th>
      <th>金額</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
const MAX = 50000000;
let records = JSON.parse(localStorage.getItem("records")) || [];

function updateUI() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let total = 0;
  records.forEach(r => {
    total += r.amount;
    const row = document.createElement("tr");
    row.innerHTML = `<td>${r.name}</td><td>${r.amount.toLocaleString()}</td>`;
    list.appendChild(row);
  });

  document.getElementById("bar").value = total;
  document.getElementById("text").innerText =
    total.toLocaleString() + " / " + MAX.toLocaleString();
}

function add() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name || amount <= 0) {
    alert("請輸入名稱與正確金額");
    return;
  }

  records.push({ name, amount });
  localStorage.setItem("records", JSON.stringify(records));

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";

  updateUI();
}

updateUI();
</script>

</body>
</html>
