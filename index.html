<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星海旅店｜潛水艇基金進度</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    max-width: 700px;
    margin: 40px auto;
    line-height: 1.6;
  }
  progress {
    width: 100%;
    height: 24px;
    margin-bottom: 12px;
  }
  input, button {
    padding: 6px;
    margin: 4px 0;
  }
  button {
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 6px;
    text-align: left;
  }
  th {
    background: #f5f5f5;
  }
  .admin {
    background: #f0f7ff;
    padding: 10px;
    margin-top: 20px;
    border-left: 4px solid #4a90e2;
  }
  .hidden {
    display: none;
  }
</style>
</head>

<body>

<h2>🚢 星海旅店｜潛水艇基金進度</h2>

<progress id="bar" value="0" max="50000000"></progress>
<p id="text">0 / 50,000,000</p>

<!-- 普通玩家輸入區 -->
<h3>新增紀錄</h3>
<input type="text" id="name" placeholder="角色名稱">
<br>
<input type="number" id="amount" placeholder="輸入金額">
<br>
<button onclick="add()">新增</button>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr>
      <th>名稱</th>
      <th>金額</th>
      <th id="actionHeader" class="hidden">操作</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<!-- 管理員登入（低調在最下面） -->
<div id="login" class="admin">
  <h4>🔒 管理員登入（低調使用）</h4>
  <input type="password" id="password" placeholder="輸入管理密碼">
  <br>
  <button onclick="login()">登入</button>
</div>

<!-- 管理模式 -->
<div id="adminPanel" class="admin hidden">
  <h4>🛠️ 管理模式</h4>
  <p>登入後可以刪除錯誤紀錄</p>
  <button onclick="logout()">登出</button>
</div>

<script>
const MAX = 50000000;
const ADMIN_PASSWORD = "starsea"; // ← 改成你自己的密碼
let records = JSON.parse(localStorage.getItem("records")) || [];
let isAdmin = false;

function updateUI() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let total = 0;
  records.forEach((r, i) => {
    total += r.amount;
    const row = document.createElement("tr");

    let actionCell = "";
    if (isAdmin) {
      actionCell = `<td><button onclick="remove(${i})">刪除</button></td>`;
    }

    row.innerHTML =
      `<td>${r.name}</td>
       <td>${r.amount.toLocaleString()}</td>
       ${actionCell}`;

    list.appendChild(row);
  });

  document.getElementById("bar").value = total;
  document.getElementById("text").innerText =
    total.toLocaleString() + " / " + MAX.toLocaleString();

  document.getElementById("adminPanel").classList.toggle("hidden", !isAdmin);
  document.getElementById("login").classList.toggle("hidden", isAdmin);
  document.getElementById("actionHeader").classList.toggle("hidden", !isAdmin);
}

function add() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name || amount <= 0) {
    alert("請輸入名稱與正確金額");
    return;
  }

  records.push({ name, amount });
  localStorage.setItem("records", JSON.stringify(records));

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";

  updateUI();
}

function remove(index) {
  if (!confirm("確定要刪除這筆紀錄？")) return;
  records.splice(index, 1);
  localStorage.setItem("records", JSON.stringify(records));
  updateUI();
}

function login() {
  const pwd = document.getElementById("password").value;
  if (pwd === ADMIN_PASSWORD) {
    isAdmin = true;
    updateUI();
  } else {
    alert("密碼錯誤");
  }
}

function logout() {
  isAdmin = false;
  updateUI();
}

updateUI();
</script>

</body>
</html>
