<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星海旅店｜買房基金進度</title>
<style>
body {
  font-family: "Noto Sans TC", system-ui, sans-serif;
  max-width: 750px;
  margin: 40px auto;
  line-height: 1.6;
  background: linear-gradient(to bottom, #0b0f2a, #1b1f3f);
  color: #f0f0f0;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

h2, h3 { color: #ffd700; text-shadow: 0 0 6px #00bfff; }

progress {
  width: 100%;
  height: 28px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  background-color: #2a2f4a;
}

progress::-webkit-progress-bar { background-color: #2a2f4a; }
progress::-webkit-progress-value { background: linear-gradient(90deg, #00bfff, #8a2be2); }
progress::-moz-progress-bar { background: linear-gradient(90deg, #00bfff, #8a2be2); }

#text {
  font-weight: bold;
  margin-bottom: 20px;
  font-size: 24px;       /* 放大字型 */
  text-align: center;     /* 置中 */
  color: #00ffff;
}

input, button {
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}

input { width: calc(50% - 10px); margin-right: 10px; }

button {
  background: linear-gradient(to right, #00bfff, #8a2be2);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: linear-gradient(to right, #8a2be2, #00bfff); }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

th {
  background: rgba(0,191,255,0.3);
  color: #fff;
  text-shadow: 0 0 3px #000;
}

tbody tr:hover { background: rgba(255,255,255,0.1); }

/* 高亮動畫 */
.highlight {
  animation: highlightAnim 3s forwards;
}

@keyframes highlightAnim {
  0% { background-color: rgba(255,255,255,0.5); }
  100% { background-color: transparent; }
}
</style>
</head>
<body>

<h2>🚢 星海旅店｜買房基金進度</h2>

<progress id="bar" value="0" max="53000000"></progress>
<p id="text">0 / 53,000,000</p>

<h3>新增紀錄</h3>
<input type="text" id="name" placeholder="角色名稱">
<input type="number" id="amount" placeholder="輸入金額">
<br>
<button onclick="addRecord()">新增</button>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr><th>名稱</th><th>金額</th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3y0EdA_6K_mvm2JQ3MdtAsOt-D1fTskGFjkpOVwus_VhBmr9zTQ9FTHp3TTPzBBjH4A/exec"; // ← 替換成你的 Apps Script URL
const MAX = 53000000;

async function fetchRecords() {
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  return data;
}

let lastCount = 0;

async function updateUI() {
  const records = await fetchRecords();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let total = 0;

  records.forEach((r, index) => {
    total += Number(r.amount);
    const row = document.createElement("tr");
    row.innerHTML = `<td>${r.name}</td><td>${Number(r.amount).toLocaleString()}</td>`;
    if(index >= lastCount) { row.classList.add("highlight"); }
    list.appendChild(row);
  });

  lastCount = records.length;
  document.getElementById("bar").value = total;
  document.getElementById("text").innerText = total.toLocaleString() + " / " + MAX.toLocaleString();
}

async function addRecord() {
  const nameInput = document.getElementById("name");
  const amountInput = document.getElementById("amount");
  const name = nameInput.value.trim();
  const amount = Number(amountInput.value);

  if (!name || amount <= 0) {
    alert("請輸入名稱與正確金額");
    return;
  }

  // 暫時停用按鈕，避免重複點擊
  const btn = document.querySelector("button");
  btn.innerText = "傳送中...";
  btn.disabled = true;

  try {
    // 這裡使用 'no-cors' 模式來避免瀏覽器阻擋
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, amount })
    });

    // 清空輸入框
    nameInput.value = "";
    amountInput.value = "";
    
    alert("發送請求成功！請稍候幾秒等待資料同步。");
    
    // 延遲 2 秒再更新 UI，給 GAS 一點寫入時間
    setTimeout(updateUI, 2000); 

  } catch (error) {
    console.error("錯誤:", error);
    alert("連線發生問題，請檢查網路或 URL 設定。");
  } finally {
    btn.innerText = "新增";
    btn.disabled = false;
  }
}

setInterval(updateUI, 5000);
updateUI();
</script>

</body>
</html>
