<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星海旅店｜買房基金進度</title>
<style>
body { font-family: system-ui; max-width:700px; margin:40px auto; line-height:1.6; }
progress { width:100%; height:24px; margin-bottom:12px; }
input, button { padding:6px; margin:4px 0; }
button { cursor:pointer; }
table { width:100%; border-collapse: collapse; margin-top:12px; }
th, td { border-bottom:1px solid #ddd; padding:6px; text-align:left; }
th { background:#f5f5f5; }
.admin { background:#f0f7ff; padding:10px; margin-top:20px; border-left:4px solid #4a90e2; }
</style>
</head>
<body>

<h2>🚢 星海旅店｜買房基金進度</h2>

<progress id="bar" value="0" max="50000000"></progress>
<p id="text">0 / 50,000,000</p>

<h3>新增紀錄</h3>
<input type="text" id="name" placeholder="角色名稱"><br>
<input type="number" id="amount" placeholder="輸入金額"><br>
<button onclick="addRecord()">新增</button>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr><th>名稱</th><th>金額</th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<!-- 管理員 -->
<div class="admin">
  <h4>🔒 管理員操作</h4>
  <p>可直接在 Google Sheet 編輯或刪除紀錄</p>
  <a href="https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID" target="_blank">管理員專用 Sheet</a>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpYF4zl0HKhAEwNB3D8H4XwvKIIBRmeBuUGmi5zWEW3_dMkpRbuu8T5PIxWEbhkSbDLw/exec"; // ← 改成你 Apps Script URL
const MAX = 50000000;

// 讀取資料
async function fetchRecords() {
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  return data;
}

// 更新 UI
async function updateUI() {
  const records = await fetchRecords();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let total = 0;
  records.forEach(r => {
    total += Number(r.amount);
    const row = document.createElement("tr");
    row.innerHTML = `<td>${r.name}</td><td>${Number(r.amount).toLocaleString()}</td>`;
    list.appendChild(row);
  });
  document.getElementById("bar").value = total;
  document.getElementById("text").innerText = total.toLocaleString() + " / " + MAX.toLocaleString();
}

// 新增紀錄
async function addRecord() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);
  if (!name || amount <= 0) { alert("請輸入名稱與正確金額"); return; }

  await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({name, amount})
  });

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
  updateUI();
}

// 每 5 秒自動刷新
setInterval(updateUI, 5000);
updateUI();
</script>

</body>
</html>
