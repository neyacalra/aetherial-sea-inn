<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星海旅店｜買房基金進度</title>
<style>
  :root {
    --primary-blue: #00bfff;
    --primary-purple: #8a2be2;
    --bg-dark: #0b0f2a;
    --card-bg: rgba(255, 255, 255, 0.07);
    --input-bg: #12162d;
  }

  body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    max-width: 750px;
    margin: 40px auto;
    line-height: 1.6;
    background: linear-gradient(135deg, #0b0f2a, #1b1f3f);
    color: #f0f0f0;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  h2 { 
    color: #ffd700; 
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); 
    text-align: center; 
    margin-bottom: 30px;
  }

  h3 { color: #ffd700; margin: 25px 0 10px 0; display: flex; align-items: center; gap: 8px; }

  /* --- 進度條容器 (槽) --- */
  .progress-container {
    width: 100%;
    height: 32px;
    background-color: rgba(0, 0, 0, 0.6); /* 未達成區域的顏色 */
    border-radius: 16px;
    position: relative;
    overflow: hidden; /* 確保內部光束不外溢 */
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }

  /* --- 進度填充層 (流光只在此處) --- */
  #bar {
    height: 100%;
    width: 0%; /* JS 控制 */
    background: linear-gradient(90deg, 
      var(--primary-blue), 
      var(--primary-purple), 
      var(--primary-blue)
    );
    background-size: 200% 100%;
    border-radius: 16px;
    position: relative;
    overflow: hidden; /* 關鍵：裁切內部掃描光束 */
    transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    animation: flowLight 3s linear infinite;
    box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
  }

  /* 內部的動態掃描強光 */
  #bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg, 
      transparent, 
      rgba(255, 255, 255, 0.3), 
      transparent
    );
    animation: scan 2s infinite linear;
  }

  @keyframes flowLight {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  #text {
    font-weight: bold;
    font-size: 24px;
    text-align: center;
    color: #00ffff;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    margin-bottom: 40px;
  }

  /* --- 輸入區塊優化 --- */
  .input-card {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    backdrop-filter: blur(5px);
  }

  input {
    flex: 2;
    min-width: 160px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: var(--input-bg);
    color: #fff;
    font-size: 16px;
    transition: all 0.3s;
  }

  input:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
  }

  #amount { flex: 1.5; }

  button {
    flex: 1;
    min-width: 120px;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(138, 43, 226, 0.5);
  }

  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- 表格樣式 --- */
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
  }

  th { background: rgba(0, 191, 255, 0.2); color: #00ffff; padding: 15px; text-align: left; }
  td { padding: 12px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

  .highlight { animation: highlightAnim 2s ease-out forwards; }
  @keyframes highlightAnim {
    0% { background-color: rgba(0, 191, 255, 0.4); }
    100% { background-color: transparent; }
  }

  @media (max-width: 480px) {
    input, button { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<h2>🏡 星海旅店｜買房基金進度</h2>

<div class="progress-container">
  <div id="bar"></div>
</div>
<p id="text">0 / 53,000,000</p>

<h3>🚀 新增貢獻</h3>
<div class="input-card">
  <input type="text" id="name" placeholder="角色名稱" autocomplete="off">
  <input type="number" id="amount" placeholder="金額 (G)">
  <button id="add-btn" onclick="addRecord()">確認新增</button>
</div>

<h3>📜 投資名冊</h3>
<table>
  <thead>
    <tr><th>名稱</th><th>金額</th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3y0EdA_6K_mvm2JQ3MdtAsOt-D1fTskGFjkpOVwus_VhBmr9zTQ9FTHp3TTPzBBjH4A/exec";
const MAX = 53000000;
let lastCount = 0;

async function fetchRecords() {
  try {
    const res = await fetch(SCRIPT_URL);
    return await res.json();
  } catch (e) { 
    console.error("讀取失敗:", e);
    return []; 
  }
}

async function updateUI() {
  const records = await fetchRecords();
  const list = document.getElementById("list");
  let total = 0;
  
  const newListHTML = records.map((r, index) => {
    total += Number(r.amount);
    const highlightClass = (index >= lastCount && lastCount !== 0) ? 'class="highlight"' : '';
    return `<tr ${highlightClass}><td>${r.name}</td><td>${Number(r.amount).toLocaleString()}</td></tr>`;
  }).reverse().join('');

  list.innerHTML = newListHTML;
  lastCount = records.length;

  // 動態更新進度條寬度
  const percentage = Math.min((total / MAX) * 100, 100);
  document.getElementById("bar").style.width = percentage + "%";
  document.getElementById("text").innerText = total.toLocaleString() + " / " + MAX.toLocaleString();
}

async function addRecord() {
  const nameInput = document.getElementById("name");
  const amountInput = document.getElementById("amount");
  const btn = document.getElementById("add-btn");
  
  if (!nameInput.value.trim() || amountInput.value <= 0) {
    alert("請填寫正確的名稱與金額");
    return;
  }

  btn.innerText = " 傳送中...";
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", 
      body: JSON.stringify({ name: nameInput.value, amount: amountInput.value })
    });

    nameInput.value = "";
    amountInput.value = "";
    // 給予後端一點寫入時間再刷 UI
    setTimeout(updateUI, 2000); 
  } catch (error) {
    alert("連線發生問題");
  } finally {
    btn.innerText = "確認新增";
    btn.disabled = false;
  }
}

// 每 3 秒自動檢查一次
setInterval(updateUI, 3000);
updateUI();
</script>

</body>
</html>
